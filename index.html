<style>
  :root{
    --paper:#FFF6E9;
    --paper-card:#FFFFFF;
    --ink:#2B2140;
    --ink-soft:#7A6F92;
    --red:#FF5D8F;
    --red-dark:#E8437A;
    --green:#22B07D;
    --green-dark:#189164;
    --gold:#FFB238;
    --purple:#8B5CF6;
    --teal:#22C7C7;
    --line:#F0DFF0;
    --line-strong:#E4C9EE;
    --shadow: 0 4px 16px rgba(139,92,246,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--paper);
    background-image: radial-gradient(circle at 12% 8%, rgba(255,178,56,0.16) 0, transparent 40%), radial-gradient(circle at 90% 4%, rgba(34,199,199,0.14) 0, transparent 40%), radial-gradient(circle at 96% 80%, rgba(255,93,143,0.12) 0, transparent 40%);
    color:var(--ink);
    font-family:'Noto Sans Bengali','IBM Plex Mono',sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  h1,h2,h3{font-family:'Tiro Bangla','Noto Sans Bengali',serif; margin:0; font-weight:400;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  header{
    background:linear-gradient(120deg,#8B5CF6 0%, #FF5D8F 55%, #FFB238 100%);
    color:#fff;
    padding:18px 16px 14px;
    position:sticky; top:0; z-index:30;
    box-shadow:0 4px 14px rgba(139,92,246,0.35);
  }
  header .top-row{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  header h1{font-size:23px; letter-spacing:0.3px;}
  header .stamp{
    font-family:'IBM Plex Mono',monospace; font-size:10px; color:#FFF3D6; letter-spacing:1px; margin-top:2px;
  }
  #userSelectWrap{display:flex; align-items:center; gap:6px; font-size:13px;}
  #userSelect{
    background:rgba(255,255,255,0.22); color:#fff; border:1.5px solid rgba(255,255,255,0.5); border-radius:20px; padding:6px 10px; font-family:inherit; font-size:13px;
  }
  nav{
    display:flex; overflow-x:auto; gap:4px; margin-top:14px; -webkit-overflow-scrolling:touch;
    border-bottom:none;
  }
  nav button{
    flex:0 0 auto; background:rgba(255,255,255,0.16); border:none; color:#fff; padding:8px 14px; font-size:13.5px;
    font-family:'Noto Sans Bengali',sans-serif; cursor:pointer; border-radius:20px; white-space:nowrap; margin-bottom:4px;
  }
  nav button.active{background:#fff; color:var(--purple); font-weight:700; box-shadow:0 2px 6px rgba(0,0,0,0.15);}
  main{max-width:960px; margin:0 auto; padding:18px 14px 60px;}
  .card{
    background:var(--paper-card); border:1px solid var(--line-strong); border-left:5px solid var(--purple);
    border-radius:16px; padding:16px 16px; margin-bottom:16px; box-shadow:var(--shadow);
  }
  .card:nth-of-type(2n){border-left-color:var(--teal);}
  .card:nth-of-type(3n){border-left-color:var(--gold);}
  .card h2{font-size:19px; margin-bottom:12px; color:var(--ink);}
  .card h2 .eyebrow{display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--purple); letter-spacing:1.5px; margin-bottom:3px; font-weight:700;}
  .grid{display:grid; gap:12px;}
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  @media (max-width:640px){ .grid.cols-2, .grid.cols-3{grid-template-columns:1fr;} }
  .stat{
    background:linear-gradient(135deg, rgba(139,92,246,0.08), rgba(34,199,199,0.08)); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  }
  .stat .label{font-size:11.5px; color:var(--ink-soft); letter-spacing:0.3px;}
  .stat .value{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700; margin-top:4px; color:var(--ink);}
  .stat .value.red{color:var(--red-dark);}
  .stat .value.green{color:var(--green-dark);}

  .leader-row .fill{flex:1; border-bottom:1px dotted var(--line-strong); margin-bottom:3px;}
  .leader-row .amt{font-family:'IBM Plex Mono',monospace; font-size:14px; white-space:nowrap; font-weight:700;}

  .stamp-due{color:#fff; border-color:var(--red); background:var(--red);}

  .icon-btn{background:transparent; border:none; cursor:pointer; color:var(--red-dark); font-size:15px;}
  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:linear-gradient(120deg,var(--purple),var(--red)); color:#fff;

  .toast.show{opacity:1;}
  .funnypop{
    position:fixed; top:14%; left:50%; transform:translate(-50%,-20px) scale(0.85) rotate(-3deg); z-index:200;
    background:linear-gradient(135deg,#FFF6E9,#FFF); border:3px solid var(--gold); border-radius:20px;
    padding:14px 20px; box-shadow:0 10px 30px rgba(139,92,246,0.35); max-width:82vw; text-align:center;

  .funnypop .fp-text{font-family:'Tiro Bangla','Noto Sans Bengali',serif; font-size:15.5px; color:var(--ink); font-weight:600; line-height:1.4;}

    22%{transform:translate(-50%,0) scale(1) rotate(-2deg);}

<script>
/* ---------------- storage helpers ----------------
   shared=true  -> Firestore (real shared DB, all 9 members see the same data)
   shared=false -> localStorage (per-device preference like language / last user) */
async function sget(key, shared, def){
  try{
    if(shared){
      const ref = window.__fsDoc(window.__db, 'mess', key);
      const snap = await window.__fsGet(ref);
      return snap.exists() ? snap.data().value : def;
    } else {
      const raw = localStorage.getItem('mess:'+key);
      return raw ? JSON.parse(raw) : def;
    }
  } catch(e){ console.error('storage get failed', key, e); return def; }
}
async function sset(key, value, shared){
  try{
    if(shared){
      const ref = window.__fsDoc(window.__db, 'mess', key);
      await window.__fsSet(ref, { value });
      return true;
    } else {
      localStorage.setItem('mess:'+key, JSON.stringify(value));
      return true;
    }
  } catch(e){ console.error('storage set failed', key, e); showToast('সেভ করতে সমস্যা হয়েছে, আবার চেষ্টা করুন'); return false; }
}
</script>

function walkTranslate(node){
  if(node.nodeType===3){
    const trimmed = node.textContent.trim();
    if(trimmed && DICT[trimmed]) node.textContent = node.textContent.replace(trimmed, DICT[trimmed]);
    return;
  }
  if(node.nodeType!==1) return;
  if(node.placeholder && DICT[node.placeholder]) node.placeholder = DICT[node.placeholder];
  node.childNodes.forEach(walkTranslate);
}
let __translating=false;
function applyLangIfNeeded(){
  if(state.lang!=='en' || __translating) return;
  __translating=true;
  walkTranslate(document.body);
  __translating=false;
}

  try{

    u.rate = 0.95; u.pitch = 1.05; u.volume = 1;

/* ---------------- one-time cleanup: normalize old messy member names ---------------- */
async function cleanupMemberNames(){
  const members = await sget('members', true, []);
  if(!members.length) return;
  // maps a lowercase substring found in the old messy name -> clean name
  const cleanMap = [
    ['maruf', 'Maruf'],
    ['fayed', 'Fayed'],
    ['adil', 'Adil Ahmed'],
    ['muhir', 'Muhir'],
    ['ahad', 'Ahad'],
    ['dip', 'Dip'],
    ['dhon', 'Dhonjoy'],
    ['touhid', 'Touhid'],
    ['shapon', 'Shapon']
  ];
  let changed = false;
  const updated = members.map(m=>{
    const lower = (m.name||'').toLowerCase();
    const hit = cleanMap.find(([key])=> lower.includes(key));
    if(hit && m.name !== hit[1]){
      changed = true;
      return Object.assign({}, m, { name: hit[1] });
    }
    return m;
  });
  if(changed){
    await sset('members', updated, true);
    await addLog('মেম্বার নাম পরিষ্কার করা হলো', 'পুরনো লম্বা নাম (Vai/Bhai/বিভাগ তথ্যসহ) বদলে ছোট ক্লিন নাম বসানো হলো।');
  }
}

/* ---------------- calculations shared ---------------- */
function mealUnitsForMember(memberId, monthData){
  let units=0;
  for(const date in monthData.meals){
    const day = monthData.meals[date];
    ['sokal','rat'].forEach(slot=>{
      if(day[slot] && day[slot].active && day[slot].members && day[slot].members[memberId]){
        units += state.settings.mealWeights[slot];
      }
      if(day[slot] && day[slot].active && day[slot].guests){
        day[slot].guests.forEach(g=>{
          if(g.hostMemberId===memberId) units += (Number(g.count)||0) * state.settings.mealWeights[slot];
        });
      }
    });
  }
  return units;
}
function guestUnitsForMember(memberId, monthData){
  let units=0;
  for(const date in monthData.meals){
    const day = monthData.meals[date];
    ['sokal','rat'].forEach(slot=>{
      if(day[slot] && day[slot].active && day[slot].guests){
        day[slot].guests.forEach(g=>{
          if(g.hostMemberId===memberId) units += (Number(g.count)||0) * state.settings.mealWeights[slot];
        });
      }
    });
  }
  return units;
}
function totalMealUnits(monthData){
  let t=0;
  for(const date in monthData.meals){
    const day = monthData.meals[date];
    ['sokal','rat'].forEach(slot=>{
      if(day[slot] && day[slot].active && day[slot].members){
        Object.values(day[slot].members).forEach(v=>{ if(v) t += state.settings.mealWeights[slot]; });
      }
      if(day[slot] && day[slot].active && day[slot].guests){
        day[slot].guests.forEach(g=>{ t += (Number(g.count)||0) * state.settings.mealWeights[slot]; });
      }
    });
  }
  return t;
}
function totalBazar(monthData){ return monthData.bazarPurchases.reduce((s,p)=>s+Number(p.amount||0),0); }
function totalExpenses(monthData){ return monthData.expenses.reduce((s,e)=>s+Number(e.amount||0),0); }
function rentAmountFor(memberId, monthData){
  const r = monthData.rent[memberId];
  if(r && r.amount!=null && r.amount!=='') return Number(r.amount);
  return Number(state.settings.rentDefault||0);
}
function isRentPaid(memberId, monthData){
  const r = monthData.rent[memberId];
  return !!(r && r.paid);
}

    }
  </div>

  <div class="card">
    <h2><span aria-hidden="true">💡</span> <span class="eyebrow">নোট</span>কীভাবে কাজ করে</h2>
    <p class="muted">এই খাতার সব তথ্য শেয়ার্ড — মেসের সবাই একই লিংক খুললে একই হিসাব দেখতে ও লিখতে পারবে। উপরে ডানপাশ থেকে নিজের নাম বেছে নিন, তাহলে আপনার করা এন্ট্রি লগ-এ আপনার নামে সেভ হবে।</p>
  </div>
  `;
  const copyBtn = document.getElementById('copyReminderBtn');
  if(copyBtn){
    copyBtn.onclick = ()=>{
      const txt = 'ভাড়া বাকি ('+monthLabel(state.monthKey)+'): ' + unpaid.map(u=>u.name).join(', ');
      navigator.clipboard.writeText(txt).then(()=>showToast('কপি হয়েছে')).catch(()=>showToast('কপি করা যায়নি'));

}

/* ---------------- MEMBERS ---------------- */
function renderMembers(){
  document.getElementById('mainArea').innerHTML = `
  <div class="card">
    <h2><span aria-hidden="true">👥</span> <span class="eyebrow">${state.members.length} জন</span>সদস্য তালিকা</h2>
    <div id="memberList">
      ${state.members.length===0 ? `<div class="empty-note">এখনো কোনো সদস্য যোগ করা হয়নি</div>` :
        state.members.map(m=>`
        <div class="memberchip">
          <div style="display:flex; align-items:center; gap:8px; flex:1; flex-wrap:wrap;">
            <strong>${escapeHtml(m.name)}</strong>
            <input type="tel" class="mono" data-editphone="${m.id}" value="${escapeHtml(m.phone||'')}" placeholder="01XXXXXXXXX" style="max-width:150px; font-size:12.5px; padding:4px 8px;">
          </div>
          <button class="icon-btn" data-del="${m.id}" title="মুছুন">✕</button>
        </div>`).join('')}
    </div>
    <hr class="divider">
    <div class="row">
      <div class="field"><label>নাম</label><input id="mName" placeholder="যেমন: রহিম"></div>
      <div class="field"><label>ফোন নম্বর (SMS রিমাইন্ডারের জন্য)</label><input id="mPhone" placeholder="01XXXXXXXXX"></div>
      <button class="btn" id="addMemberBtn">সদস্য যোগ করুন</button>
    </div>
  </div>`;
  document.getElementById('addMemberBtn').onclick = async ()=>{
    const name = document.getElementById('mName').value.trim();
    const phone = document.getElementById('mPhone').value.trim();
    if(!name){ showToast('নাম লিখুন'); return; }
    state.members.push({id:uid(), name, phone});
    await sset('members', state.members, true);
    await addLog('সদস্য যোগ', name+' যোগ করা হয়েছে');
    buildUserSelect();
    renderMembers();
    showToast('যোগ হয়েছে');
  };
  document.getElementById('memberList').querySelectorAll('[data-editphone]').forEach(inp=>{
    inp.onchange = async ()=>{
      const id = inp.dataset.editphone;
      const mem = state.members.find(x=>x.id===id);
      const old = mem.phone || '';
      const val = inp.value.trim();
      if(old===val) return;
      mem.phone = val;
      await sset('members', state.members, true);
      await addLog('ফোন নম্বর পরিবর্তন', mem.name+': '+(old||'—')+' → '+(val||'—'));
      showToast('সেভ হয়েছে');
    };
  });
  document.getElementById('memberList').querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = async ()=>{
      const id=b.dataset.del;
      const mem = state.members.find(x=>x.id===id);
      if(b.dataset.confirming !== 'yes'){
        b.dataset.confirming = 'yes';
        b.textContent = 'নিশ্চিত?';
        b.style.color = '#c0392b';
        b.style.fontWeight = '700';
        setTimeout(()=>{ if(b.dataset.confirming==='yes'){ b.dataset.confirming='no'; b.textContent='✕'; b.style.fontWeight=''; } }, 3000);
        return;
      }
      state.members = state.members.filter(x=>x.id!==id);
      await sset('members', state.members, true);
      await addLog('সদস্য মোছা', mem.name+' মুছে ফেলা হয়েছে');
      buildUserSelect();
      renderMembers();
    };
  });
}

    ${state.members.length===0 ? `<div class="empty-note">প্রথমে "সদস্য" ট্যাব থেকে সদস্য যোগ করুন</div>` : `
    <div class="tablewrap"><table>
      <thead><tr><th>নাম</th><th>ভাড়ার পরিমাণ</th><th>স্ট্যাটাস</th><th>একশন</th></tr></thead>
      <tbody>

        const amt = rentAmountFor(mem.id,m);

  });

/* ---------------- MEALS ---------------- */
function renderMeals(){
  const m = state.monthData;
  if(!state._mealDate) state._mealDate = todayStr();
  if(!state._guestOpen) state._guestOpen = {sokal:false, rat:false};
  const date = state._mealDate;
  if(!m.meals[date]) m.meals[date] = {sokal:{active:false, members:{}, guests:[]}, rat:{active:false, members:{}, guests:[]}};
  const day = m.meals[date];
  ['sokal','rat'].forEach(s=>{ if(!day[s].guests) day[s].guests=[]; });

  function slotHtml(slotKey, label, weight){
    const slot = day[slotKey];
    return `<div class="mealslot">
      <div class="headrow">
        <strong>${label} <span class="muted mono">(ওজন ${weight})</span></strong>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
          <input type="checkbox" data-slotactive="${slotKey}" ${slot.active?'checked':''}> মিল হচ্ছে
        </label>
      </div>
      ${slot.active ? `<div class="checklist">
        ${state.members.map(mem=>`
          <label class="checkitem">
            <input type="checkbox" data-slot="${slotKey}" data-mem="${mem.id}" ${slot.members[mem.id]?'checked':''}>
            ${escapeHtml(mem.name)}
          </label>`).join('')}
      </div>
      <hr class="divider" style="margin:10px 0">
      ${slot.guests.length>0 ? slot.guests.map((g,i)=>{
        const host = state.members.find(x=>x.id===g.hostMemberId);
        return `<div class="leader-row"><span class="lbl">${escapeHtml(host?host.name:'—')} এর ${g.count} জন গেস্ট${g.note?' ('+escapeHtml(g.note)+')':''}</span><span class="fill"></span><button class="icon-btn" data-delguest="${slotKey}:${i}" style="font-size:12px">✕</button></div>`;
      }).join('') : ''}
      <button type="button" class="btn ghost small" data-guesttoggle="${slotKey}" style="font-size:12.5px; padding:4px 10px;">${state._guestOpen && state._guestOpen[slotKey] ? '− গেস্ট মিল ফর্ম বন্ধ করুন' : '+ গেস্ট মিল যোগ করুন ▾'}</button>
      ${state._guestOpen && state._guestOpen[slotKey] ? `
      <div class="row" style="margin-top:6px">
        <div class="field" style="min-width:100px"><label>মেহমান কার</label>
          <select data-guesthost="${slotKey}">${state.members.map(mm=>`<option value="${mm.id}">${escapeHtml(mm.name)}</option>`).join('')}</select>
        </div>
        <div class="field" style="max-width:80px"><label>সংখ্যা</label><input type="number" min="1" value="1" data-guestcount="${slotKey}"></div>
        <div class="field" style="flex:2"><label>নোট (ঐচ্ছিক)</label><input data-guestnote="${slotKey}" placeholder="যেমন: বন্ধু এসেছে"></div>
        <button class="btn ghost small" data-addguest="${slotKey}">যোগ</button>
      </div>` : ''}
      ` : `<div class="muted" style="font-size:12.5px">এই স্লটে মিল বন্ধ চিহ্নিত</div>`}
    </div>`;
  }

  document.getElementById('mainArea').innerHTML = `
  <div class="card">
    <h2><span aria-hidden="true">🍛</span> <span class="eyebrow">দৈনিক মিল</span>মিল এন্ট্রি</h2>
    <div class="field" style="max-width:220px"><label>তারিখ</label><input type="date" id="mealDate" value="${date}"></div>
    ${state.members.length===0 ? `<div class="empty-note">প্রথমে সদস্য যোগ করুন</div>` : `
      ${slotHtml('sokal','সকাল', state.settings.mealWeights.sokal)}
      ${slotHtml('rat','রাত', state.settings.mealWeights.rat)}
      <button class="btn" id="saveMealBtn">এই দিনের মিল সেভ করুন</button>
    `}
  </div>
  <div class="card">
    <h2><span aria-hidden="true">🍽️</span> এই মাসের মিল সংখ্যা (সদস্যভিত্তিক)</h2>
    ${state.members.length===0 ? `<div class="empty-note">—</div>` : `
    <div class="tablewrap"><table><thead><tr><th>নাম</th><th>নিজের+গেস্ট মিল ইউনিট</th><th>এর মধ্যে গেস্ট ইউনিট</th></tr></thead><tbody>
    ${state.members.map(mem=>`<tr><td>${escapeHtml(mem.name)}</td><td class="mono">${mealUnitsForMember(mem.id, m)}</td><td class="mono muted">${guestUnitsForMember(mem.id,m)}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="muted" style="margin-top:6px">গেস্ট মিলের খরচ যার মেহমান তার হিসাবেই যোগ হয়।</p>`}
  </div>`;

  document.getElementById('mealDate').onchange = (e)=>{ state._mealDate = e.target.value; renderMeals(); };
  document.querySelectorAll('[data-slotactive]').forEach(cb=>{
    cb.onchange = ()=>{ day[cb.dataset.slotactive].active = cb.checked; renderMeals(); };
  });
  document.querySelectorAll('[data-slot]').forEach(cb=>{
    cb.onchange = ()=>{
      const slot = cb.dataset.slot, memId = cb.dataset.mem;
      day[slot].members[memId] = cb.checked;
    };
  });
  document.querySelectorAll('[data-guesttoggle]').forEach(btn=>{
    btn.onclick = ()=>{
      const slot = btn.dataset.guesttoggle;
      state._guestOpen[slot] = !state._guestOpen[slot];
      renderMeals();
    };
  });
  document.querySelectorAll('[data-addguest]').forEach(btn=>{
    btn.onclick = ()=>{
      const slot = btn.dataset.addguest;
      const hostSel = document.querySelector(`[data-guesthost="${slot}"]`);
      const countInp = document.querySelector(`[data-guestcount="${slot}"]`);
      const noteInp = document.querySelector(`[data-guestnote="${slot}"]`);
      const count = Number(countInp.value)||1;
      if(!hostSel.value){ showToast('মেহমান কার নির্বাচন করুন'); return; }
      day[slot].guests.push({hostMemberId: hostSel.value, count, note: noteInp.value.trim()});
      renderMeals();
    };
  });
  document.querySelectorAll('[data-delguest]').forEach(btn=>{
    btn.onclick = ()=>{
      const [slot, idx] = btn.dataset.delguest.split(':');
      day[slot].guests.splice(Number(idx),1);
      renderMeals();
    };
  });
  const saveBtn = document.getElementById('saveMealBtn');
  if(saveBtn){
    saveBtn.onclick = async ()=>{
      await saveMonth();
      const sokalCount = Object.values(day.sokal.members).filter(Boolean).length;
      const ratCount = Object.values(day.rat.members).filter(Boolean).length;
      await addLog('মিল এন্ট্রি সেভ', date+': সকাল '+sokalCount+' জন, রাত '+ratCount+' জন');
      showToast('মিল সেভ হয়েছে');
      renderMeals();
    };
  }
}

      <div class="field"><label>তারিখ <span class="muted" id="bzRangeLabel" style="font-size:11px"></span></label><input type="date" id="bzDate" value="${todayStr()}"></div>
      <div class="field"><label>পরিমাণ (৳) <span class="muted" style="font-size:11px">— পুরো পালার মোট খরচ</span></label><input type="number" id="bzAmount" placeholder="0"></div>
      <div class="field" style="flex:2"><label>নোট (কি বাজার হলো)</label><input id="bzNote" placeholder="যেমন: মাছ, সবজি"></div>
      <button class="btn" id="addBazarBtn">যোগ করুন</button>
    </div>`}
    <hr class="divider">
    <div class="tablewrap"><table>
      <thead><tr><th>তারিখ</th><th>কে</th><th>পরিমাণ</th><th>নোট</th><th></th></tr></thead>
      <tbody>
      ${m.bazarPurchases.length===0 ? `<tr><td colspan="5" class="empty-note">কোনো এন্ট্রি নেই</td></tr>` :
        m.bazarPurchases.slice().sort((a,b)=>a.date<b.date?1:-1).map(p=>{
          const mem = state.members.find(x=>x.id===p.memberId);
          return `<tr><td class="mono">${p.date}</td><td>${mem?escapeHtml(mem.name):'—'}</td><td class="mono">${money(p.amount)}</td><td>${escapeHtml(p.note||'')}</td>
          <td><button class="icon-btn" data-delbz="${p.id}">✕</button></td></tr>`;
        }).join('')}
      </tbody>
      <tfoot><tr><td colspan="2" style="font-weight:600">মোট</td><td class="mono" style="font-weight:600">${money(totalBazar(m))}</td><td colspan="2"></td></tr></tfoot>
    </table></div>
  </div>`;

  document.getElementById('genRotationBtn').onclick = async ()=>{
    if(state.members.length===0){ showToast('সদস্য নেই'); return; }
    const cycleDays = Number(document.getElementById('cycleDays').value)||3;
    let day=1, idx=state.settings.bazarNextIndex||0;
    const assignments=[];
    while(day<=dim){
      const end = Math.min(day+cycleDays-1, dim);
      assignments.push({memberId: state.members[idx % state.members.length].id, startDay: day, endDay: end});
      day = end+1; idx++;
    }
    m.bazarRotation = {startIndex: state.settings.bazarNextIndex||0, cycleDays, assignments};
    state.settings.bazarNextIndex = idx % state.members.length;
    await sset('settings', state.settings, true);
    await saveMonth();
    await addLog('বাজার রোটেশন তৈরি', monthLabel(state.monthKey)+' এর জন্য নতুন পালা তৈরি হয়েছে');
    renderBazar();
  };
  document.querySelectorAll('[data-editassn]').forEach(btn=>{
    btn.onclick = async ()=>{
      const i = Number(btn.dataset.editassn);
      const options = state.members.map((mm,idx)=>idx+': '+mm.name).join('\n');
      const pick = prompt('নতুন দায়িত্বপ্রাপ্ত সদস্যের নাম্বার লিখুন —\n'+options);
      if(pick===null) return;
      const idx = Number(pick);
      if(isNaN(idx) || !state.members[idx]){ showToast('সঠিক নম্বর দিন'); return; }
      const old = state.members.find(x=>x.id===m.bazarRotation.assignments[i].memberId);
      m.bazarRotation.assignments[i].memberId = state.members[idx].id;
      await saveMonth();
      await addLog('বাজার পালা পরিবর্তন', (old?old.name:'—')+' → '+state.members[idx].name);
      renderBazar();
    };
  });
  const addBtn = document.getElementById('addBazarBtn');
  if(addBtn){
    const bzMemberSel = document.getElementById('bzMember');
    const updateBzRange = ()=>{
      const memberId = bzMemberSel.value;
      const dim2 = daysInMonth(state.monthKey);
      const todayDay = (state.monthKey===currentMonthKey()) ? new Date().getDate() : null;
      const assns = m.bazarRotation.assignments.filter(a=>a.memberId===memberId);
      const rangeLabel = document.getElementById('bzRangeLabel');
      if(assns.length===0){ rangeLabel.textContent=''; return; }
      let pick = assns.find(a=> todayDay!==null && todayDay>=a.startDay && todayDay<=a.endDay);
      if(!pick) pick = assns[0];
      const [y,mo] = state.monthKey.split('-').map(Number);
      const endDay = Math.min(pick.endDay, dim2);
      const dateStr = y+'-'+String(mo).padStart(2,'0')+'-'+String(endDay).padStart(2,'0');
      document.getElementById('bzDate').value = dateStr;
      const days = pick.endDay - pick.startDay + 1;
      rangeLabel.textContent = '(পালা: '+pick.startDay+'–'+pick.endDay+', '+days+' দিন — মোট খরচ শেষ দিনে যোগ হবে)';
    };
    bzMemberSel.onchange = updateBzRange;
    updateBzRange();
    addBtn.onclick = async ()=>{
      const memberId = document.getElementById('bzMember').value;
      const date = document.getElementById('bzDate').value || todayStr();
      const amount = Number(document.getElementById('bzAmount').value);
      const note = document.getElementById('bzNote').value.trim();
      if(!amount){ showToast('পরিমাণ লিখুন'); return; }
      m.bazarPurchases.push({id:uid(), memberId, date, amount, note});
      await saveMonth();
      const mem = state.members.find(x=>x.id===memberId);
      await addLog('বাজার এন্ট্রি', (mem?mem.name:'—')+': '+money(amount)+' ('+date+')');
      renderBazar(); showToast('যোগ হয়েছে');
    };
  }
  document.querySelectorAll('[data-delbz]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.delbz;
      const p = m.bazarPurchases.find(x=>x.id===id);
      if(b.dataset.confirming !== 'yes'){
        b.dataset.confirming = 'yes';
        b.textContent = 'নিশ্চিত?';
        b.style.color = '#c0392b';
        b.style.fontWeight = '700';
        setTimeout(()=>{ if(b.dataset.confirming==='yes'){ b.dataset.confirming='no'; b.textContent='✕'; b.style.fontWeight=''; } }, 3000);
        return;
      }
      m.bazarPurchases = m.bazarPurchases.filter(x=>x.id!==id);
      await saveMonth();
      await addLog('বাজার এন্ট্রি মোছা', money(p.amount)+' ('+p.date+') মুছে ফেলা হয়েছে');
      renderBazar();
    };
  });
}

/* ---------------- EXPENSES ---------------- */
function renderExpenses(){
  const m = state.monthData;
  document.getElementById('mainArea').innerHTML = `
  <div class="card">
    <h2><span aria-hidden="true">💸</span> <span class="eyebrow">${monthLabel(state.monthKey)}</span>অন্যান্য খরচ (ওয়াইফাই, বুয়া, সার্ভিস চার্জ ইত্যাদি)</h2>
    <div class="row">
      <div class="field" style="flex:2"><label>খরচের নাম</label><input id="expName" placeholder="যেমন: ওয়াইফাই বিল"></div>
      <div class="field"><label>পরিমাণ (৳)</label><input type="number" id="expAmount"></div>
      <div class="field"><label>তারিখ</label><input type="date" id="expDate" value="${todayStr()}"></div>
      <button class="btn" id="addExpBtn">যোগ করুন</button>
    </div>
    <hr class="divider">
    <div class="tablewrap"><table>
      <thead><tr><th>তারিখ</th><th>নাম</th><th>পরিমাণ</th><th>যোগ করেছেন</th><th></th></tr></thead>
      <tbody>
      ${m.expenses.length===0 ? `<tr><td colspan="5" class="empty-note">কোনো খরচ যোগ করা হয়নি</td></tr>` :
        m.expenses.slice().sort((a,b)=>a.date<b.date?1:-1).map(e=>`
        <tr><td class="mono">${e.date}</td><td>${escapeHtml(e.name)}</td><td class="mono">${money(e.amount)}</td><td class="muted">${escapeHtml(e.addedBy||'—')}</td>
        <td><button class="icon-btn" data-delexp="${e.id}">✕</button></td></tr>`).join('')}
      </tbody>
      <tfoot><tr><td colspan="2" style="font-weight:600">মোট</td><td class="mono" style="font-weight:600">${money(totalExpenses(m))}</td><td colspan="2"></td></tr></tfoot>
    </table></div>
    <p class="muted" style="margin-top:8px">এই খরচ সবার মধ্যে সমানভাবে ভাগ হয়ে "মাসিক হিসাব" ট্যাবে যোগ হবে।</p>
  </div>`;
  document.getElementById('addExpBtn').onclick = async ()=>{
    const name = document.getElementById('expName').value.trim();
    const amount = Number(document.getElementById('expAmount').value);
    const date = document.getElementById('expDate').value || todayStr();
    if(!name || !amount){ showToast('নাম ও পরিমাণ লিখুন'); return; }
    m.expenses.push({id:uid(), name, amount, date, addedBy: currentUserName()});
    await saveMonth();
    await addLog('খরচ যোগ', name+': '+money(amount));
    renderExpenses(); showToast('যোগ হয়েছে');
  };
  document.querySelectorAll('[data-delexp]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.delexp;
      const e = m.expenses.find(x=>x.id===id);
      if(b.dataset.confirming !== 'yes'){
        b.dataset.confirming = 'yes';
        b.textContent = 'নিশ্চিত?';
        b.style.color = '#c0392b';
        b.style.fontWeight = '700';
        setTimeout(()=>{ if(b.dataset.confirming==='yes'){ b.dataset.confirming='no'; b.textContent='✕'; b.style.fontWeight=''; } }, 3000);
        return;
      }
      m.expenses = m.expenses.filter(x=>x.id!==id);
      await saveMonth();
      await addLog('খরচ মোছা', e.name+': '+money(e.amount)+' মুছে ফেলা হয়েছে');
      renderExpenses();
    };
  });
}

/* ---------------- REPORT ---------------- */
function renderReport(){
  const m = state.monthData;
  const tBazar = totalBazar(m);
  const tUnits = totalMealUnits(m);
  const mealRate = tUnits>0 ? tBazar/tUnits : 0;
  const tExp = totalExpenses(m);
  const expShare = state.members.length>0 ? tExp/state.members.length : 0;
  let grand = 0;

  const rows = state.members.map(mem=>{
    const units = mealUnitsForMember(mem.id, m);
    const mealCost = units*mealRate;
    const rent = rentAmountFor(mem.id, m);
    const total = rent + mealCost + expShare;
    grand += total;
    return {mem, units, mealCost, rent, paid: isRentPaid(mem.id,m), total};
  });

  document.getElementById('mainArea').innerHTML = `
  <div class="card">
    <h2><span aria-hidden="true">📈</span> <span class="eyebrow">মাসিক হিসাব</span>${monthLabel(state.monthKey)}</h2>
    <div class="leader-row"><span class="lbl">মোট বাজার খরচ</span><span class="fill"></span><span class="amt">${money(tBazar)}</span></div>
    <div class="leader-row"><span class="lbl">মোট মিল ইউনিট</span><span class="fill"></span><span class="amt">${tUnits}</span></div>
    <div class="leader-row"><span class="lbl">প্রতি মিল ইউনিট রেট</span><span class="fill"></span><span class="amt">${money(mealRate.toFixed(2))}</span></div>
    <div class="leader-row"><span class="lbl">মোট অন্যান্য খরচ</span><span class="fill"></span><span class="amt">${money(tExp)}</span></div>
    <div class="leader-row"><span class="lbl">মাথাপিছু অন্যান্য খরচ</span><span class="fill"></span><span class="amt">${money(expShare.toFixed(2))}</span></div>
  </div>
  <div class="card">
    <h2><span aria-hidden="true">🧾</span> সদস্যভিত্তিক সম্পূর্ণ হিসাব</h2>
    ${state.members.length===0 ? `<div class="empty-note">সদস্য নেই</div>` : `
    <div class="tablewrap"><table>
      <thead><tr><th>নাম</th><th>ভাড়া</th><th>মিল ইউনিট</th><th>মিল খরচ</th><th>অন্যান্য (ভাগ)</th><th>সর্বমোট</th></tr></thead>
      <tbody>
      ${rows.map(r=>`<tr>
        <td>${escapeHtml(r.mem.name)} ${r.paid?'<span class="stamp-badge stamp-paid" style="transform:none;padding:1px 6px;font-size:9px">✓</span>':''}</td>
        <td class="mono">${money(r.rent)}</td>
        <td class="mono">${r.units}</td>
        <td class="mono">${money(r.mealCost.toFixed(2))}</td>
        <td class="mono">${money(expShare.toFixed(2))}</td>
        <td class="mono" style="font-weight:700">${money(r.total.toFixed(2))}</td>
      </tr>`).join('')}
      </tbody>
      <tfoot><tr><td style="font-weight:700">সর্বমোট</td><td colspan="4"></td><td class="mono" style="font-weight:700">${money(grand.toFixed(2))}</td></tr></tfoot>
    </table></div>`}
  </div>`;
}

/* ---------------- LOG ---------------- */
async function renderLog(){
  if(!isFayedUser()){ state.activeTab='dashboard'; buildNav(); renderDashboard(); return; }
  document.getElementById('mainArea').innerHTML = `<div class="card"><h2><span aria-hidden="true">📜</span> <span class="eyebrow">অডিট লগ</span>সব পরিবর্তনের ইতিহাস</h2><div id="logList" class="muted">লোড হচ্ছে...</div></div>`;
  const log = await sget('auditLog', true, []);
  const el = document.getElementById('logList');
  if(log.length===0){ el.innerHTML = `<div class="empty-note">এখনো কোনো লগ নেই</div>`; return; }
  el.innerHTML = log.map(l=>`
    <div class="logentry">
      <span class="ts">${new Date(l.ts).toLocaleString('bn-BD')}</span> — <strong>${escapeHtml(l.actor)}</strong> · ${escapeHtml(l.action)}<br>
      <span>${escapeHtml(l.detail)}</span>
    </div>`).join('');
}

init();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW register failed', e));
  });
}
</script>
